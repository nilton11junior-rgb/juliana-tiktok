<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorizar TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;background:#fff7f4;color:#2b1d19}
code{display:block;word-break:break-all;background:#fff;border:1px solid #e9b8a8;border-radius:10px;padding:14px;margin:14px 0}</style>
</head><body>
<h1>Autorização do TikTok</h1>
<p id="msg">Lendo o código...</p>
<code id="codigo"></code>
<script>
const p = new URLSearchParams(location.search);
const c = p.get("code");
document.getElementById("msg").textContent = c
  ? "Copie o código abaixo e rode: python3 src/autorizar_tiktok.py codigo <CÓDIGO>"
  : "Nenhum código recebido. Erro: " + (p.get("error_description") || p.get("error") || "desconhecido");
document.getElementById("codigo").textContent = c || "";
</script>
</body></html>
